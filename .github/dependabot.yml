version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Madrid"

    groups:
      major-deps:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"

      minor-patch-deps:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
